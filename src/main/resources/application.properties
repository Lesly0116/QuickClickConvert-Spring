# Configuration Spring Boot
spring.application.name=ConvertirFichier
server.port=8080

# Base de donn\u00e9es - Configuration flexible
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/convertdocs?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:LeSlY1602}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${java.io.tmpdir}

# ConvertAPI
convertapi.secret=${CONVERTAPI_SECRET:T8u4mn99kmAmccY8z0cFXBxl7JXPr7q3}

# Upload directory
upload.directory=${UPLOAD_DIR:C:/ConvertDocs/uploads/}

# Timeout configuration
server.connection-timeout=120000
server.tomcat.connection-timeout=120000
server.tomcat.max-swallow-size=100MB