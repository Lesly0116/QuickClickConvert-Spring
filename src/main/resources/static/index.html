<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>QuickClick Convert - Convertisseur de documents</title>

    <style>
        :root {
    --bleu-marin: #1e3a5f;
    --bleu-ciel: #e6f3ff;
    --jaune-abricot: #fbc4ab;
    --jaune-abricot-fonce: #f9b091;
    --blanc: #ffffff;
    --gris-clair: #f8fafc;
    --gris-sombre: #2d3748;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(145deg, var(--bleu-ciel) 0%, #d4e7f0 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    width: 100%;
}

body::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(251, 196, 171, 0.1) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
}

body::after {
    content: '';
    position: absolute;
    bottom: -50px;
    left: -50px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(30, 58, 95, 0.05) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
}

.container {
    max-width: 1000px;
    width: 100%;
    background: var(--blanc);
    padding: 60px 50px;
    border-radius: 40px;
    box-shadow: 0 30px 60px -15px rgba(30, 58, 95, 0.2);
    text-align: center;
    position: relative;
    z-index: 10;
    animation: fadeInUp 0.6s ease-out;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    margin: 20px;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, var(--bleu-marin), var(--jaune-abricot), var(--bleu-marin));
    border-radius: 40px 40px 0 0;
}

h1 {
    font-size: clamp(32px, 8vw, 52px);
    font-weight: 800;
    color: var(--bleu-marin);
    margin-bottom: 16px;
    letter-spacing: -0.02em;
    line-height: 1.2;
    position: relative;
    display: inline-block;
    word-break: break-word;
    hyphens: auto;
    max-width: 100%;
}

h1::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 4px;
    background: var(--jaune-abricot);
    border-radius: 2px;
}

@media (max-width: 480px) {
    h1::after {
        width: 60px;
        height: 3px;
    }
}

.subtitle {
    font-size: clamp(16px, 4vw, 20px);
    color: #4a5568;
    margin-bottom: 30px;
    font-weight: 400;
    letter-spacing: 0.3px;
    position: relative;
    display: inline-block;
    padding: 0 20px;
    word-break: break-word;
}

.subtitle::before,
.subtitle::after {
    content: '•';
    color: var(--jaune-abricot);
    font-size: 24px;
    margin: 0 10px;
    opacity: 0.7;
    display: inline-block;
}

.description {
    font-size: clamp(16px, 3vw, 18px);
    color: var(--gris-sombre);
    line-height: 1.8;
    margin-bottom: 40px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
    background: var(--bleu-ciel);
    padding: clamp(20px, 5vw, 35px);
    border-radius: clamp(16px, 4vw, 24px);
    border: 1px solid rgba(30, 58, 95, 0.1);
    width: 100%;
    word-wrap: break-word;
}

.typeCon {
    color: var(--bleu-marin);
    font-weight: 700;
    background: linear-gradient(120deg, var(--jaune-abricot) 0%, var(--jaune-abricot) 40%, transparent 80%);
    padding: 4px 12px;
    border-radius: 30px;
    display: inline-block;
    margin: 0 2px;
    font-size: clamp(15px, 2.5vw, 17px);
    transition: all 0.3s ease;
    white-space: normal;
    word-break: break-word;
}

.typeCon:hover {
    background: var(--jaune-abricot);
    transform: scale(1.05);
}

.btn {
    display: inline-block;
    padding: clamp(14px, 3vw, 18px) clamp(35px, 8vw, 52px);
    background: var(--bleu-marin);
    color: white;
    font-size: clamp(16px, 3vw, 18px);
    font-weight: 600;
    text-decoration: none;
    border-radius: 50px;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 20px rgba(30, 58, 95, 0.2);
    margin-top: 20px;
    border: 2px solid transparent;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
    width: auto;
    min-width: 200px;
    max-width: 100%;
}

.btn::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    transform: translate(-50%, -50%);
    transition: width 0.6s ease, height 0.6s ease;
}

.btn:hover {
    background: #15304d;
    transform: translateY(-4px);
    box-shadow: 0 15px 30px rgba(30, 58, 95, 0.3);
}

.btn:hover::before {
    width: 300px;
    height: 300px;
}

.btn:active {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(30, 58, 95, 0.2);
}

footer {
    margin-top: 50px;
    color: #718096;
    font-size: clamp(12px, 3vw, 14px);
    border-top: 1px solid #e2e8f0;
    padding-top: 30px;
    position: relative;
    width: 100%;
}

footer::before {
    content: '✦';
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--blanc);
    padding: 0 20px;
    color: var(--jaune-abricot);
    font-size: 18px;
    white-space: nowrap;
}

/* Responsive Design amélioré */
@media (max-width: 1024px) {
    .container {
        max-width: 90%;
        padding: 50px 40px;
    }
}

@media (max-width: 768px) {
    body {
        padding: 10px;
    }
    
    .container {
        padding: 40px 25px;
        margin: 15px;
        border-radius: 30px;
    }

    .subtitle::before,
    .subtitle::after {
        display: none;
    }

    .typeCon {
        display: inline-block;
        padding: 3px 10px;
        margin: 2px;
    }
    
    .btn {
        min-width: 180px;
    }
}

@media (max-width: 480px) {
    body {
        padding: 5px;
    }
    
    .container {
        padding: 30px 20px;
        margin: 10px;
        border-radius: 25px;
    }

    .description {
        padding: 20px 15px;
        margin-bottom: 30px;
    }

    .btn {
        padding: 14px 25px;
        min-width: 160px;
        width: 100%;
        font-size: 16px;
    }
    
    footer {
        margin-top: 40px;
        padding-top: 25px;
    }
    
    footer::before {
        font-size: 16px;
        padding: 0 15px;
    }
}

@media (max-width: 360px) {
    .container {
        padding: 25px 15px;
    }
    
    h1 {
        font-size: 28px;
    }
    
    .subtitle {
        font-size: 15px;
    }
    
    .description {
        padding: 15px 12px;
        font-size: 14px;
    }
    
    .typeCon {
        font-size: 13px;
        padding: 2px 6px;
    }
    
    .btn {
        padding: 12px 20px;
        font-size: 15px;
        min-width: 140px;
    }
}

@media (min-width: 1400px) {
    .container {
        max-width: 1100px;
        padding: 70px 60px;
    }
    
    h1 {
        font-size: 58px;
    }
    
    .subtitle {
        font-size: 22px;
    }
    
    .description {
        font-size: 20px;
        max-width: 800px;
        padding: 40px;
    }
}

@media (max-height: 600px) and (orientation: landscape) {
    body {
        align-items: flex-start;
        padding: 20px;
    }
    
    .container {
        padding: 30px 40px;
        margin: 10px auto;
    }
    
    h1 {
        font-size: 32px;
        margin-bottom: 10px;
    }
    
    .subtitle {
        margin-bottom: 20px;
    }
    
    .description {
        padding: 20px;
        margin-bottom: 25px;
    }
    
    footer {
        margin-top: 30px;
        padding-top: 20px;
    }
}

@keyframes float {
    0% {
        transform: translateY(0px);
    }
    50% {
        transform: translateY(-5px);
    }
    100% {
        transform: translateY(0px);
    }
}

.btn {
    animation: float 3s ease-in-out infinite;
}

::selection {
    background: var(--jaune-abricot);
    color: var(--bleu-marin);
}

::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: var(--bleu-ciel);
}

::-webkit-scrollbar-thumb {
    background: var(--bleu-marin);
    border-radius: 5px;
}

::-webkit-scrollbar-thumb:hover {
    background: #15304d;
}

@media (hover: none) and (pointer: coarse) {
    .btn:hover {
        transform: none;
        box-shadow: 0 8px 20px rgba(30, 58, 95, 0.2);
    }
    
    .btn:hover::before {
        display: none;
    }
    
    .btn:active {
        transform: translateY(-2px);
        background: #15304d;
    }
    
    .typeCon:hover {
        transform: none;
    }
}

@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    
    .btn {
        animation: none;
    }
}
    </style>
</head>

<body>
    <div class="container">
        <h1>Bienvenu sur QuickClick Convert</h1>
        <p class="subtitle">Convertisseur de documents en ligne</p>

        <p class="description">
            Convertissez facilement vos fichiers <strong class="typeCon">Word en PDF</strong>,
            <strong class="typeCon">PDF en Word</strong> et <strong class="typeCon">PDF en Excel</strong>.
            <br>
            Profitez d’une conversion rapide, simple et sécurisée.
        </p>

        <a href="login.html" class="btn">Commencer maintenant</a>

        <footer>
            © 2026 Petit Con – Tous droits réservés
        </footer>
    </div>
</body>
</html>
