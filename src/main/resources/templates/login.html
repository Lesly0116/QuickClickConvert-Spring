<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>QuickClick Convert - Connexion</title>

    <style>
        :root {
            --bleu-marin: #1e3a5f;
            --bleu-ciel: #e6f3ff;
            --jaune-abricot: #fbc4ab;
            --jaune-abricot-fonce: #f9b091;
            --blanc: #ffffff;
            --gris-clair: #f8fafc;
            --gris-sombre: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, var(--bleu-ciel) 0%, #d4e7f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(251, 196, 171, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(30, 58, 95, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .login-container {
            max-width: 460px;
            width: 100%;
            background: var(--blanc);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 30px 60px -15px rgba(30, 58, 95, 0.2);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin: 20px;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--bleu-marin), var(--jaune-abricot), var(--bleu-marin));
            border-radius: 40px 40px 0 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 800;
            color: var(--bleu-marin);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            line-height: 1.2;
            display: inline-block;
        }

        .logo::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--jaune-abricot);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .subtitle {
            font-size: clamp(14px, 3.5vw, 16px);
            color: #4a5568;
            margin-bottom: 30px;
            font-weight: 400;
        }

        h2 {
            color: var(--bleu-marin);
            font-size: clamp(20px, 5vw, 24px);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 30px;
            margin-bottom: 25px;
            font-size: 14px;
            background: linear-gradient(145deg, var(--bleu-ciel), #d4e7f0);
            border: 1px solid rgba(30, 58, 95, 0.1);
            color: var(--bleu-marin);
            animation: fadeIn 0.3s ease;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--bleu-marin);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            background: var(--gris-clair);
            border: 2px solid transparent;
            border-radius: 30px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:hover {
            border-color: var(--jaune-abricot);
            background: white;
        }

        input:focus {
            outline: none;
            border-color: var(--jaune-abricot);
            background: white;
            box-shadow: 0 5px 15px rgba(251, 196, 171, 0.3);
            transform: translateY(-2px);
        }

        .btn {
            width: 100%;
            padding: 16px 30px;
            background: var(--bleu-marin);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(30, 58, 95, 0.2);
            margin-top: 15px;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn:hover {
            background: #15304d;
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(30, 58, 95, 0.3);
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:active {
            transform: translateY(-2px);
        }

        .links {
            margin-top: 25px;
            color: #718096;
            font-size: 14px;
        }

        .links a {
            color: var(--bleu-marin);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .links a:hover {
            color: #15304d;
            border-bottom-color: var(--jaune-abricot);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .login-container {
                padding: 40px 30px;
                margin: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .login-container {
                padding: 30px 20px;
                border-radius: 30px;
            }

            input {
                padding: 12px 18px;
            }

            .btn {
                padding: 14px 25px;
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 25px 15px;
            }
            
            .logo {
                font-size: 32px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 15px;
            }
            
            .login-container {
                padding: 30px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .btn::before {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">QuickClick Convert</div>
        <p class="subtitle">L'ultime convertisseur de fichiers</p>
        
        <h2>Connexion</h2>
        
        <div th:if="${param.inscription != null}" class="alert alert-success">
            Inscription réussie ! Vous pouvez maintenant vous connecter.
        </div>
        
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        
        <form action="#" th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="votre@email.com" />
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" />
            </div>
            
            <button type="submit" class="btn">Se connecter</button>
        </form>
        
        <div class="links">
            Pas encore de compte ? <a href="/inscription">S'inscrire</a>
        </div>
    </div>
</body>
</html>
