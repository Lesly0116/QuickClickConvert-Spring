<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>QuickClick Convert - Déconnexion</title>

    <style>
        :root {
            --bleu-marin: #1e3a5f;
            --bleu-ciel: #e6f3ff;
            --jaune-abricot: #fbc4ab;
            --jaune-abricot-fonce: #f9b091;
            --blanc: #ffffff;
            --gris-clair: #f8fafc;
            --gris-sombre: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, var(--bleu-ciel) 0%, #d4e7f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(251, 196, 171, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(30, 58, 95, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .logout-container {
            max-width: 460px;
            width: 100%;
            background: var(--blanc);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 30px 60px -15px rgba(30, 58, 95, 0.2);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeInUp 0.6s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin: 20px;
        }

        .logout-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--bleu-marin), var(--jaune-abricot), var(--bleu-marin));
            border-radius: 40px 40px 0 0;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 800;
            color: var(--bleu-marin);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            line-height: 1.2;
            display: inline-block;
        }

        .logo::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--jaune-abricot);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        .subtitle {
            font-size: clamp(14px, 3.5vw, 16px);
            color: #4a5568;
            margin-bottom: 30px;
            font-weight: 400;
        }

        h2 {
            color: var(--bleu-marin);
            font-size: clamp(20px, 5vw, 24px);
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: var(--gris-sombre);
            margin-bottom: 30px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: var(--bleu-marin);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(30, 58, 95, 0.2);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn:hover {
            background: #15304d;
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(30, 58, 95, 0.3);
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:active {
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logout-container {
                padding: 40px 30px;
                margin: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .logout-container {
                padding: 30px 20px;
                border-radius: 30px;
            }

            .btn {
                padding: 14px 30px;
                font-size: 15px;
            }
        }

        @media (max-width: 360px) {
            .logout-container {
                padding: 25px 15px;
            }
            
            .logo {
                font-size: 32px;
            }
            
            h2 {
                font-size: 22px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 15px;
            }
            
            .logout-container {
                padding: 30px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .btn::before {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logo">QuickClick Convert</div>
        <p class="subtitle">L'ultime convertisseur de fichiers</p>
        
        <h2>Déconnexion réussie</h2>
        <p>Vous avez été déconnecté avec succès.</p>
        
        <a th:href="@{/login}" class="btn">Se reconnecter</a>
    </div>
</body>
</html>
