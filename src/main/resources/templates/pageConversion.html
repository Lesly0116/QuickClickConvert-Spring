<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>QuickClick Convert - Conversion</title>

    <style>
        :root {
            --bleu-marin: #1e3a5f;
            --bleu-ciel: #e6f3ff;
            --jaune-abricot: #fbc4ab;
            --jaune-abricot-fonce: #f9b091;
            --blanc: #ffffff;
            --gris-clair: #f8fafc;
            --gris-sombre: #2d3748;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(145deg, var(--bleu-ciel) 0%, #d4e7f0 100%);
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
            width: 100%;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(251, 196, 171, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(30, 58, 95, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 30px;
            background: var(--blanc);
            border-radius: 50px;
            box-shadow: 0 20px 40px -15px rgba(30, 58, 95, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.6s ease-out;
        }

        .navbar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--bleu-marin), var(--jaune-abricot), var(--bleu-marin));
            border-radius: 50px 50px 0 0;
            opacity: 0.5;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--bleu-marin);
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--gris-sombre);
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            padding: 5px 0;
            border-bottom: 3px solid transparent;
        }

        .nav-link:hover {
            color: var(--bleu-marin);
            border-bottom-color: var(--jaune-abricot);
        }

        .nav-link.active {
            color: var(--bleu-marin);
            border-bottom-color: var(--jaune-abricot);
        }

        .logout-btn {
            background: none;
            border: 2px solid var(--jaune-abricot);
            padding: 8px 20px;
            border-radius: 30px;
            color: var(--bleu-marin);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: var(--jaune-abricot);
            color: var(--bleu-marin);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(251, 196, 171, 0.3);
        }

        .card {
            background: var(--blanc);
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 30px 60px -15px rgba(30, 58, 95, 0.2);
            position: relative;
            animation: fadeInUp 0.6s ease-out 0.1s both;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--bleu-marin), var(--jaune-abricot), var(--bleu-marin));
            border-radius: 40px 40px 0 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--bleu-ciel);
            flex-wrap: wrap;
            gap: 15px;
        }

        .card-title {
            font-size: clamp(22px, 5vw, 28px);
            font-weight: 700;
            color: var(--bleu-marin);
        }

        .user-info {
            color: var(--gris-sombre);
            font-weight: 500;
            background: var(--bleu-ciel);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
        }

        .alert {
            padding: 15px 25px;
            border-radius: 50px;
            margin-bottom: 25px;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
            background: var(--blanc);
            border: 2px solid;
        }

        .alert-success {
            border-color: #4caf50;
            color: #2e7d32;
            background: #e8f5e9;
        }

        .alert-error {
            border-color: #f44336;
            color: #c62828;
            background: #ffebee;
        }

        .download-section {
            background: linear-gradient(145deg, var(--bleu-marin), #15304d);
            color: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px -10px rgba(30, 58, 95, 0.4);
        }

        .download-section h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .download-link {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 40px;
            background: var(--jaune-abricot);
            color: var(--bleu-marin);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .download-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            background: var(--jaune-abricot-fonce);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--bleu-marin);
            font-size: 15px;
        }

        input, select {
            width: 100%;
            padding: 15px 20px;
            background: var(--gris-clair);
            border: 2px solid transparent;
            border-radius: 30px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:hover, select:hover {
            border-color: var(--jaune-abricot);
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--jaune-abricot);
            background: white;
            box-shadow: 0 5px 15px rgba(251, 196, 171, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            width: 100%;
            padding: 16px 30px;
            background: var(--bleu-marin);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(30, 58, 95, 0.2);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn-primary:hover {
            background: #15304d;
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(30, 58, 95, 0.3);
        }

        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary:active {
            transform: translateY(-2px);
        }

        h3 {
            color: var(--bleu-marin);
            font-size: clamp(18px, 4vw, 22px);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .table-container {
            overflow-x: auto;
            background: var(--gris-clair);
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            text-align: left;
            padding: 15px;
            color: var(--bleu-marin);
            font-weight: 700;
            font-size: 14px;
            border-bottom: 3px solid var(--jaune-abricot);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--bleu-ciel);
            color: var(--gris-sombre);
            font-size: 14px;
        }

        tr:hover td {
            background: white;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 0 3px;
        }

        .badge-pdf {
            background: #ffebee;
            color: #c62828;
        }

        .badge-docx {
            background: #e3f2fd;
            color: #1565c0;
        }

        .badge-xlsx {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .pagination {
            text-align: right;
            margin-top: 20px;
        }

        .pagination a {
            color: var(--bleu-marin);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .pagination a:hover {
            color: var(--jaune-abricot-fonce);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .container {
                max-width: 95%;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
            }

            .card {
                padding: 30px 25px;
            }

            .download-section {
                padding: 30px 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px 10px;
            }

            .navbar {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 30px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .user-info {
                width: 100%;
                text-align: center;
            }

            .btn-primary {
                padding: 14px 25px;
                font-size: 15px;
            }

            .download-section {
                padding: 25px 15px;
            }

            .download-link {
                padding: 12px 25px;
                font-size: 14px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 20px 15px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-link {
                font-size: 14px;
            }

            .logout-btn {
                padding: 6px 15px;
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .btn-primary::before {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">QuickClick Convert</div>
            <div class="nav-links">
                <a href="/conversion/page" class="nav-link active">Conversion</a>
                <a href="/conversion/historique" class="nav-link">Mes documents</a>
                <a href="/logout" class="logout-btn">Déconnexion</a>
            </div>
        </nav>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Convertisseur de fichiers</h2>
                <span class="user-info" th:text="'Bienvenue, ' + ${utilisateur.email} + ' !'"></span>
            </div>
            
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <div th:if="${document}" class="download-section">
                <h3>✅ Fichier converti avec succès !</h3>
                <p th:text="'Fichier : ' + ${document.nomFichierConverti}"></p>
                <a th:href="@{'/conversion/telecharger/' + ${document.nomFichierConverti}}" class="download-link">
                    📥 Télécharger le fichier converti
                </a>
            </div>
            
            <form action="#" th:action="@{/conversion/convertir}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="fichier">Choisir un fichier à convertir</label>
                    <input type="file" id="fichier" name="fichier" required />
                </div>
                
                <div class="form-group">
                    <label for="format">Format de sortie</label>
                    <select id="format" name="format" required>
                        <option value="">Sélectionnez un format</option>
                        <option value="docx">PDF → Word (docx)</option>
                        <option value="xlsx">PDF → Excel (xlsx)</option>
                        <option value="pdf">Word → PDF</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">Convertir le fichier</button>
            </form>
            
            <div th:if="${historique != null && !historique.isEmpty()}" style="margin-top: 30px;">
                <h3>📋 Dernières conversions</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Fichier</th>
                                <th>Format</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="doc, stat : ${historique}" th:if="${stat.index < 5}">
                                <td th:text="${doc.nomFichier}"></td>
                                <td>
                                    <span class="badge" th:classappend="${doc.typeAvant == 'pdf' ? 'badge-pdf' : (doc.typeAvant == 'docx' ? 'badge-docx' : 'badge-xlsx')}" th:text="${doc.typeAvant}"></span>
                                    →
                                    <span class="badge" th:classappend="${doc.typeApres == 'pdf' ? 'badge-pdf' : (doc.typeApres == 'docx' ? 'badge-docx' : 'badge-xlsx')}" th:text="${doc.typeApres}"></span>
                                </td>
                                <td th:text="${#temporals.format(doc.dateConversion, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{'/conversion/telecharger/' + ${doc.nomFichierConverti}}" style="color: var(--bleu-marin); text-decoration: none; font-weight: 600;">📥 Télécharger</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <a href="/conversion/historique">Voir tout l'historique →</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
