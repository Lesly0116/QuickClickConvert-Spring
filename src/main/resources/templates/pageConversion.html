<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petit Con - Conversion de fichiers</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #3b82f6;
            --accent-light: #dbeafe;
            --accent-dark: #1d4ed8;
            --border-light: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--accent);
        }

        .nav-link.active {
            color: var(--accent);
            font-weight: 600;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--border-light);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            color: var(--error);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .logout-btn:hover {
            background: #fee2e2;
            border-color: var(--error);
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            margin-bottom: 2rem;
            border: 1px solid var(--border-light);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border-light);
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        input:hover, select:hover {
            border-color: var(--accent-light);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .download-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 2rem;
        }

        .download-link {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.75rem 2rem;
            background: white;
            color: var(--accent);
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .download-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-light);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-secondary);
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-pdf {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-docx {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-xlsx {
            background: #d1fae5;
            color: #065f46;
        }

        .pagination {
            text-align: right;
            margin-top: 1rem;
        }

        .pagination a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo">Petit Con</div>
            <div class="nav-links">
                <a href="/conversion/page" class="nav-link active">Conversion</a>
                <a href="/conversion/historique" class="nav-link">Mes documents</a>
                <a href="/logout" class="logout-btn">Déconnexion</a>
            </div>
        </nav>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Convertisseur de fichiers</h2>
                <span th:text="'Bienvenue, ' + ${utilisateur.email} + ' !'" style="color: var(--text-secondary);"></span>
            </div>
            
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <div th:if="${document}" class="download-section">
                <h3>✅ Fichier converti avec succès !</h3>
                <p th:text="'Fichier : ' + ${document.nomFichierConverti}"></p>
                <a th:href="@{'/conversion/telecharger/' + ${document.nomFichierConverti}}" class="download-link">
                    📥 Télécharger le fichier converti
                </a>
            </div>
            
            <form action="#" th:action="@{/conversion/convertir}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="fichier">Choisir un fichier à convertir</label>
                    <input type="file" id="fichier" name="fichier" required />
                </div>
                
                <div class="form-group">
                    <label for="format">Format de sortie</label>
                    <select id="format" name="format" required>
                        <option value="">Sélectionnez un format</option>
                        <option value="docx">PDF → Word (docx)</option>
                        <option value="xlsx">PDF → Excel (xlsx)</option>
                        <option value="pdf">Word → PDF</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Convertir le fichier</button>
            </form>
            
            <div th:if="${historique != null && !historique.isEmpty()}" style="margin-top: 2rem;">
                <h3 style="margin-bottom: 1rem;">📋 Dernières conversions</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Fichier</th>
                                <th>Format</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="doc, stat : ${historique}" th:if="${stat.index < 5}">
                                <td th:text="${doc.nomFichier}"></td>
                                <td>
                                    <span class="badge" th:classappend="${doc.typeAvant == 'pdf' ? 'badge-pdf' : (doc.typeAvant == 'docx' ? 'badge-docx' : 'badge-xlsx')}" th:text="${doc.typeAvant}"></span>
                                    →
                                    <span class="badge" th:classappend="${doc.typeApres == 'pdf' ? 'badge-pdf' : (doc.typeApres == 'docx' ? 'badge-docx' : 'badge-xlsx')}" th:text="${doc.typeApres}"></span>
                                </td>
                                <td th:text="${#temporals.format(doc.dateConversion, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{'/conversion/telecharger/' + ${doc.nomFichierConverti}}" style="color: var(--accent); text-decoration: none; font-weight: 500;">📥 Télécharger</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <a href="/conversion/historique">Voir tout l'historique →</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
